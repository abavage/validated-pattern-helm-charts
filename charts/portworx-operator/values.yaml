namespace: portworx

subscription:
  name: portworx-certified
  channel: stable
  installPlanApproval: Manual
  source: certified-operators
  sourceNamespace: openshift-marketplace
  startingCSV: ""

operatorGroup:
  create: true
  name: portworx-operator-group

storageCluster:
  enabled: true
  name: px-cluster
  # Required: IAM role ARN for Portworx workload identity (from terraform output portworx_role_arn)
  iamRoleArn: ""
  imageVersion: "3.6.1"
  startPort: 17001
  syncWave: 5
  smallNode: false
  autopilot:
    enabled: true
    prometheusUrl: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
  cloudStorage:
    deviceSpecs:
      - type: gp3
        size: 20
        iops: 3000
    initialStorageNodes: 3
    kvdbDeviceSpec: "type=gp3,size=5,iops=3000"
  ocpDynamicPlugin:
    cacheAgentImage: "docker.io/portworx/px-cache-agent:1.1.0-ea"
    pluginImage: "docker.io/portworx/portworx-dynamic-plugin:2.3.0-ea"

monitoring:
  enableUserWorkload: true

helper-status-checker:
  enabled: true
  approver: true
  checks:
    - operatorName: portworx-operator
      subscriptionName: portworx-certified
      namespace:
        name: portworx
      sleeptimer: 10
      maxretries: 60
      serviceAccount:
        name: "portworx-status-checker"
