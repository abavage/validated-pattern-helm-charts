{{- if .Values.pullSecret.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "acm-observability.fullname" . }}-pull-secret-job
  namespace: {{ include "acm-observability.namespace" . }}
  labels:
    {{- include "acm-observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "acm-observability.fullname" . }}-pull-secret-reader
  labels:
    {{- include "acm-observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["pull-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "acm-observability.fullname" . }}-pull-secret-reader
  labels:
    {{- include "acm-observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "acm-observability.fullname" . }}-pull-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "acm-observability.fullname" . }}-pull-secret-job
    namespace: {{ include "acm-observability.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "acm-observability.fullname" . }}-pull-secret-writer
  namespace: {{ include "acm-observability.namespace" . }}
  labels:
    {{- include "acm-observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "acm-observability.fullname" . }}-pull-secret-writer
  namespace: {{ include "acm-observability.namespace" . }}
  labels:
    {{- include "acm-observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "acm-observability.fullname" . }}-pull-secret-writer
subjects:
  - kind: ServiceAccount
    name: {{ include "acm-observability.fullname" . }}-pull-secret-job
    namespace: {{ include "acm-observability.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "acm-observability.fullname" . }}-copy-pull-secret
  namespace: {{ include "acm-observability.namespace" . }}
  labels:
    {{- include "acm-observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "acm-observability.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "acm-observability.fullname" . }}-pull-secret-job
      restartPolicy: OnFailure
      containers:
        - name: copy-pull-secret
          image: {{ .Values.pullSecret.jobImage | default "registry.redhat.io/openshift4/ose-cli:latest" }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              TARGET_NS="{{ include "acm-observability.namespace" . }}"
              SECRET_NAME="{{ .Values.pullSecret.name }}"

              DOCKER_CONFIG=$(oc get secret pull-secret -n openshift-config -o jsonpath='{.data.\.dockerconfigjson}')

              oc apply -f - <<EOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: ${SECRET_NAME}
                namespace: ${TARGET_NS}
              type: kubernetes.io/dockerconfigjson
              data:
                .dockerconfigjson: ${DOCKER_CONFIG}
              EOF

              echo "Pull secret copied to ${TARGET_NS}/${SECRET_NAME}"
{{- end }}
