{{- if and .Values.coo.enabled .Values.coo.uiPlugin.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "acm-observability.fullname" . }}-coo-wait
  namespace: {{ include "acm-observability.namespace" . }}
  labels:
    {{- include "acm-observability.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "acm-observability.fullname" . }}-coo-wait
  labels:
    {{- include "acm-observability.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["installplans"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "acm-observability.fullname" . }}-coo-wait
  labels:
    {{- include "acm-observability.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "acm-observability.fullname" . }}-coo-wait
subjects:
  - kind: ServiceAccount
    name: {{ include "acm-observability.fullname" . }}-coo-wait
    namespace: {{ include "acm-observability.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "acm-observability.fullname" . }}-coo-wait
  namespace: {{ include "acm-observability.namespace" . }}
  labels:
    {{- include "acm-observability.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: hook-succeeded
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "acm-observability.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "acm-observability.fullname" . }}-coo-wait
      restartPolicy: OnFailure
      containers:
        - name: wait-for-coo
          image: {{ .Values.pullSecret.jobImage | default "registry.redhat.io/openshift4/ose-cli:latest" }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              NS="openshift-operators"
              CSV_NAME="cluster-observability-operator.v{{ .Values.coo.version | default "1.4.0" }}"

              echo "Step 1: Approve InstallPlan for COO if needed..."
              for i in $(seq 1 30); do
                PLAN=$(oc get installplan -n "${NS}" -o json | \
                  python3 -c "
              import sys, json
              plans = json.load(sys.stdin)['items']
              for p in plans:
                if not p['spec'].get('approved', False):
                  csvs = p['spec'].get('clusterServiceVersionNames', [])
                  if '${CSV_NAME}' in csvs:
                    print(p['metadata']['name'])
                    break
              " 2>/dev/null || true)

                if [ -n "${PLAN}" ]; then
                  echo "Found unapproved InstallPlan: ${PLAN}, approving..."
                  oc patch installplan "${PLAN}" -n "${NS}" --type merge -p '{"spec":{"approved":true}}'
                  echo "InstallPlan approved."
                  break
                fi

                APPROVED=$(oc get installplan -n "${NS}" -o json | \
                  python3 -c "
              import sys, json
              plans = json.load(sys.stdin)['items']
              for p in plans:
                if p['spec'].get('approved', False):
                  csvs = p['spec'].get('clusterServiceVersionNames', [])
                  if '${CSV_NAME}' in csvs:
                    print('yes')
                    break
              " 2>/dev/null || true)

                if [ "${APPROVED}" = "yes" ]; then
                  echo "InstallPlan already approved."
                  break
                fi

                echo "Attempt ${i}/30: InstallPlan not found yet, waiting 10s..."
                sleep 10
              done

              echo "Step 2: Wait for CSV to succeed..."
              for i in $(seq 1 60); do
                PHASE=$(oc get csv "${CSV_NAME}" -n "${NS}" -o jsonpath='{.status.phase}' 2>/dev/null || true)
                if [ "${PHASE}" = "Succeeded" ]; then
                  echo "CSV ${CSV_NAME} is ready."
                  break
                fi
                echo "Attempt ${i}/60: CSV phase=${PHASE:-not found}, waiting 10s..."
                sleep 10
              done

              echo "Step 3: Wait for UIPlugin CRD..."
              for i in $(seq 1 30); do
                if oc get crd uiplugins.observability.openshift.io >/dev/null 2>&1; then
                  echo "UIPlugin CRD is available."
                  exit 0
                fi
                echo "Attempt ${i}/30: CRD not yet available, waiting 10s..."
                sleep 10
              done

              echo "ERROR: UIPlugin CRD not available after waiting."
              exit 1
{{- end }}
