{{- if and .Values.lokiStack.enabled .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.lokiStack.storage.secretName }}
  namespace: {{ .Values.lokiStack.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,ServerSideApply=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.lokiStack.storage.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: audience
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: audience
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: bucketnames
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: bucketnames
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: region
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: region
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: role_arn
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: role_arn
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
