---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-netobserv-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: netobserv-operator
  namespace: openshift-netobserv-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: netobserv-operator
  namespace: openshift-netobserv-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: stable
  installPlanApproval: Manual
  name: netobserv-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  {{- if .Values.netobservOperator.startingCSV }}
  startingCSV: {{ .Values.netobservOperator.startingCSV }}
  {{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-operators-redhat
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: loki-operator
  namespace: openshift-operators-redhat
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: loki-operator
  namespace: openshift-operators-redhat
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: stable-6.2
  installPlanApproval: Manual
  name: loki-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  {{- if .Values.lokiOperator.startingCSV }}
  startingCSV: {{ .Values.lokiOperator.startingCSV }}
  {{- end }}
  {{- if .Values.lokiOperator.roleArn }}
  config:
    env:
      - name: ROLEARN
        value: {{ .Values.lokiOperator.roleArn }}
  {{- end }}
