{{- range .Values.subscriptions }}
{{- if .enabled }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: {{ .channel }}
  installPlanApproval: {{ .installPlanApproval }}
  name: {{ .name }}
  source: {{ .source }}
  sourceNamespace: {{ .sourceNamespace }}
  {{- if .startingCSV }}
  startingCSV: {{ .startingCSV }}
  {{- end }}
  {{- if .roleArn }}
  config:
    env:
      - name: ROLEARN
        value: {{ .roleArn }}
  {{- end }}
{{- end }}
{{- end }}
