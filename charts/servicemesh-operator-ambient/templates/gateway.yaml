{{- if and .Values.ambient.enabled .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.ambient.istio.namespace }}
  annotations:
    networking.istio.io/service-type: {{ .Values.gateway.serviceType }}
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: istio
  listeners:
  {{- range .Values.gateway.listeners }}
  - name: {{ .name }}
    port: {{ .port }}
    protocol: {{ .protocol }}
    allowedRoutes:
      namespaces:
        from: All
  {{- end }}
{{- if .Values.gateway.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.ambient.istio.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  port:
    targetPort: http
  to:
    kind: Service
    name: {{ .Values.gateway.name }}-istio
  wildcardPolicy: None
{{- end }}
{{- end }}
