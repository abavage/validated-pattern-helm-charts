{{- if .Values.certManagerRole }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-restart
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-restart
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-restart
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-restart
subjects:
  - kind: ServiceAccount
    name: cert-manager-restart
    namespace: cert-manager
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cert-manager-restart
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: cert-manager-restart
      restartPolicy: OnFailure
      containers:
        - name: restart
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Deleting all cert-manager pods to pick up IRSA annotation..."
              oc delete pods --all -n cert-manager
              echo "Waiting for pods to come back..."
              sleep 30
              oc get pods -n cert-manager
              echo "cert-manager pods restarted successfully"
{{- end }}
