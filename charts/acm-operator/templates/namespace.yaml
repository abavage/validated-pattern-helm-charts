{{ range $ns := .Values.namespaces -}}
---
apiVersion: v1
kind: Namespace
metadata:
  name: "{{ $ns.name }}"
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    {{- with $ns.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if $ns.labels }}
  labels:
    {{- toYaml $ns.labels | nindent 4 }}
  {{- end }}
---
{{ end -}}
